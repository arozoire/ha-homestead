add_planting:
  fields:
    name:
      required: true
      example: "Melo vicino al pozzo"
      selector:
        text:
    species:
      example: "Malus domestica"
      selector:
        text:
    taxon_id:
      selector:
        text:
    variety:
      example: "Renetta"
      selector:
        text:
    plant_type:
      selector:
        select:
          translation_key: plant_type
          options:
            - tree
            - shrub
            - vine
            - vegetable
            - herb
            - flower
            - other
    kind:
      default: single
      selector:
        select:
          translation_key: planting_kind
          options:
            - single
            - group
    quantity:
      default: 1
      selector:
        number:
          min: 1
          max: 10000
          mode: box
    origin:
      selector:
        select:
          translation_key: planting_origin
          options:
            - existing
            - planted
            - sown
    sown_on:
      selector:
        date:
    planted_on:
      selector:
        date:
    birth_year:
      example: 2015
      selector:
        number:
          min: 1000
          max: 2200
          mode: box
    initial_form:
      selector:
        select:
          translation_key: initial_form
          options:
            - seed
            - cutting
            - bulb
            - bare_root
            - potted
            - one_year
            - two_years
            - other
    initial_height_cm:
      selector:
        number:
          min: 0
          max: 2000
          unit_of_measurement: cm
          mode: box
    rootstock:
      selector:
        text:
    supplier:
      selector:
        text:
    zone_id:
      selector:
        text:
    latitude:
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    price:
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    seed_lot_id:
      selector:
        text:
    notes:
      selector:
        text:
          multiline: true

